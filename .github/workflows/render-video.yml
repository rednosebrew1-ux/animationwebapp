name: Render Custom Video

on:
  repository_dispatch:
    types: [trigger-video-render]

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Chrome Dependencies
        run: npx remotion browser ensure

      - name: Render Video File
        run: |
          mkdir -p out
          npx remotion render MyComp out/video.mp4 --props='${{ toJson(github.event.client_payload) }}'

      - name: Commit MP4 to renders branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Switch to renders branch (create if it doesn't exist)
          git fetch origin renders || true
          git checkout renders 2>/dev/null || git checkout --orphan renders

          # Copy the rendered file with the renderId as filename
          RENDER_ID="${{ github.event.client_payload.renderId }}"
          cp out/video.mp4 "${RENDER_ID}.mp4"

          git add "${RENDER_ID}.mp4"
          git commit -m "Rendered video: ${RENDER_ID}"
          git push origin renders
